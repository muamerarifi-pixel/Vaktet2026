name: vaktet
description: "Vaktet – kohët e namazit në Kosovë sipas Takvimit të Bashkësisë Islame të Kosovës. Punon pa internet."
publish_to: 'none'
version: 1.5.0+13

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
    # the countdown's own faces: digits and colon only (assets/fonts/countdown, OFL)
    - family: VaktetCormorant
      fonts:
        - asset: assets/fonts/countdown/CormorantGaramond.ttf
    - family: VaktetPlayfair
      fonts:
        - asset: assets/fonts/countdown/PlayfairDisplay.ttf
    - family: VaktetCinzel
      fonts:
        - asset: assets/fonts/countdown/Cinzel.ttf
    - family: VaktetOutfit
      fonts:
        - asset: assets/fonts/countdown/Outfit.ttf
    - family: VaktetUnbounded
      fonts:
        - asset: assets/fonts/countdown/Unbounded.ttf
