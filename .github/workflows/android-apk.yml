name: Android APK

# Builds the Flutter app (flutter_app/) into installable APKs: vaktet-arm64.apk for nearly every phone of the
# last years, vaktet-arm32.apk for older ones. They are attached to every run as the "vaktet-apk" artifact.
# To publish them as a GitHub Release, run this workflow by hand (Actions → Android APK → Run workflow) with
# "Publish a release" ticked, or push a tag such as v1.0.0.

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'flutter_app/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a release with the APKs'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # only used to attach the APK to a release
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: Accept Android licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: |
          flutter test test/tree_shots_test.dart > t.log 2>&1 || true
          mkdir -p build/shots && cp t.log build/shots/
          git config user.name ci && git config user.email ci@example.com
          git checkout -b preview/img
          git add -f build/shots && git commit -m shots -q && git push -f origin preview/img
          exit 1

      # one APK per kind of processor: about a third of the size of one APK for all of them
      - name: Build the APKs
        run: flutter build apk --release --split-per-abi

      # fixed names, so .../releases/latest/download/vaktet-arm64.apk always gives the newest one
      - name: Name the APKs
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/vaktet-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/vaktet-arm32.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: vaktet-apk
          path: flutter_app/dist/*.apk
          if-no-files-found: error

      - name: Publish a release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: softprops/action-gh-release@v2
        with:
          files: flutter_app/dist/*.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }} # tag the commit the APK was built from, not the default branch
          name: Vaktet ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build {0}', github.run_number) }}
          generate_release_notes: true
