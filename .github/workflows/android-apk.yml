name: Android APK & Native Windows

# Builds:
#   1. Android APK: vaktet-arm64.apk (ARM64 only)
#   2. 100% Native Windows: Vaktet-Windows-Portable.zip and Vaktet.msi (Flutter C++ / Win32 / DirectX)
#
# To publish them as a GitHub Release, run this workflow by hand (Actions → Android APK & Native Windows → Run workflow) with
# "Publish a release" ticked, or push a tag such as v1.9.14.

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'flutter_app/**'
      - 'windows/**'
      - 'icons/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'flutter_app/**'
      - 'windows/**'
      - 'icons/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a release with APK and Native Windows deliverables'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK (ARM64)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: Accept Android licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Build exclusively ARM64 APK
      - name: Build the APK
        run: flutter build apk --release --split-per-abi

      - name: Name the APKs
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/vaktet-arm64.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: vaktet-arm64-apk
          path: flutter_app/dist/vaktet-arm64.apk
          if-no-files-found: error

  build-windows:
    name: Build Native Windows App (Flutter C++ & MSI)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Fetch Flutter Dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build Native Windows App (Release)
        working-directory: flutter_app
        run: flutter build windows --release

      - name: Package Native Windows Deliverables (ZIP & MSI)
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File windows/build.ps1 -FlutterReleaseDir "flutter_app\build\windows\x64\runner\Release"

      - uses: actions/upload-artifact@v4
        with:
          name: vaktet-windows
          path: |
            dist/windows/Vaktet-Windows-Portable.zip
            dist/windows/Vaktet.msi
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-apk, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create release directory
        run: mkdir -p release-assets

      - uses: actions/download-artifact@v4
        with:
          name: vaktet-arm64-apk
          path: release-assets

      - uses: actions/download-artifact@v4
        with:
          name: vaktet-windows
          path: release-assets

      - name: List Release Assets
        run: ls -la release-assets

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/vaktet-arm64.apk
            release-assets/Vaktet-Windows-Portable.zip
            release-assets/Vaktet.msi
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: Vaktet ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build {0}', github.run_number) }}
          generate_release_notes: true
