name: Android APK

# Builds the Flutter app (flutter_app/) into an installable APK.
# The APK is attached to every run as the "vaktet-apk" artifact. To publish it as a GitHub Release,
# run this workflow by hand (Actions → Android APK → Run workflow) with "Publish a release" ticked,
# or push a tag such as v1.0.0.

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'flutter_app/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a release with the APK'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # only used to attach the APK to a release
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: Accept Android licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build the APK
        run: flutter build apk --release

      - name: Name the APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/vaktet-${GITHUB_SHA::7}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: vaktet-apk
          path: flutter_app/dist/*.apk
          if-no-files-found: error

      - name: Publish a release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: softprops/action-gh-release@v2
        with:
          files: flutter_app/dist/*.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }} # tag the commit the APK was built from, not the default branch
          name: Vaktet ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build {0}', github.run_number) }}
          generate_release_notes: true
